[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termart"
version = "1.0.0"
description = "Render images as ANSI terminal art"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0.0", "click>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
termart = "termart.cli:main"
